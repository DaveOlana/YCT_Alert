databases:
  - name: yct-alert-db
    databaseName: yct_alert
    user: yct_alert_user
    plan: free

services:
  # Fastify API Web Service (Render Free Tier: spins down after 15m idle, 512MB RAM, 750h/mo workspace quota)
  - type: web
    name: yct-alert-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@yctalert/contracts && npm run build --workspace=@yctalert/api
    startCommand: npm run migrate:up --workspace=@yctalert/api && npm run bootstrap:admin:ensure --workspace=@yctalert/api && npm run start --workspace=@yctalert/api
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: yct-alert-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: yct-alert-db
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: IDEMPOTENCY_REPLAY_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_COOKIE_SAMESITE
        value: none
      - key: ALLOW_LOCAL_NON_TEST_REPORTS
        value: "false"
      - key: YCT_MAP_BASE_URL
        value: https://yct-map.onrender.com
      - key: GEOGRAPHY_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: CORS_ALLOWED_ORIGINS
        value: https://yct-alert-public.onrender.com,https://yct-alert-admin.onrender.com,https://yct-map.onrender.com,https://localhost,capacitor://localhost

  # Public Incident Reporter Frontend (PWA) — Render Static Site (Free)
  - type: web
    name: yct-alert-public
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@yctalert/contracts && npm run build --workspace=@yctalert/public
    staticPublishPath: apps/public/dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yct-alert-api
          envVarKey: RENDER_EXTERNAL_URL

  # Safety Moderation & Governance Admin Portal — Render Static Site (Free)
  - type: web
    name: yct-alert-admin
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@yctalert/contracts && npm run build --workspace=@yctalert/admin
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yct-alert-api
          envVarKey: RENDER_EXTERNAL_URL
